<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · BELIEVE Pharmacy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--p:#6d28d9;--p2:#8b5cf6;--pl:#f5f0ff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e8e8ed;--w:#fff;--bg:#fbfbfd;--f2:#d2d2d7}
@media(prefers-color-scheme:dark){:root{--p:#8b5cf6;--pl:#221838;--ink:#f5f5f7;--mute:#a1a1a6;--line:#2c2c2e;--w:#161618;--bg:#0b0b0c;--f2:#3a3a3c}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.top{display:flex;gap:16px;align-items:center;padding:14px 22px;background:var(--w);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top b{margin-right:auto}.top a,.link{color:var(--p);background:none;border:0;cursor:pointer;font-size:14px;text-decoration:none}
main{max-width:980px;margin:0 auto;padding:28px 22px 80px}
h1{font-size:30px;letter-spacing:-.02em;margin-bottom:6px}
.note{color:var(--mute);font-size:14px}
.btn{border:0;border-radius:99px;padding:10px 20px;background:var(--p);color:#fff;cursor:pointer}
.btn.g{background:transparent;color:var(--p);border:1px solid var(--f2)}.btn.sm{padding:6px 14px;font-size:14px}.btn.d{background:#d92d20}
.btn:disabled{opacity:.5}
.panel{background:var(--w);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}
form{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.two,.three{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mute);display:grid;gap:6px}
input,select,textarea{border:1px solid var(--f2);border-radius:12px;padding:10px 12px;background:var(--w);width:100%}
.tabs{display:flex;gap:8px;margin:18px 0 0}.tabs button{border:1px solid var(--f2);background:var(--w);border-radius:99px;padding:8px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--w);border-color:var(--ink)}
.msg{font-size:14px;min-height:1.2em;margin-top:8px}.msg.e{color:#d92d20}.msg.o{color:#05603a}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img,.row .ph{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--pl);display:grid;place-items:center;font-size:26px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.off{opacity:.5}
.ord{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:6px;font-size:15px}
.ord .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><b>BELIEVE Pharmacy · Admin</b><span class="note" id="who"></span><a href="index.html">View site</a><button class="link" id="out" hidden>Sign out</button></div>

<main id="login" hidden>
  <h1>Admin sign in</h1><p class="note">For BELIEVE Pharmacy staff only.</p>
  <form class="panel" id="lf" style="max-width:420px">
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button><div class="msg e" id="lm" role="alert"></div>
  </form>
</main>

<main id="app" hidden>
  <div class="tabs" id="tabs">
    <button data-t="products" aria-pressed="true">Products</button><button data-t="orders" aria-pressed="false">Orders</button><button data-t="rx" aria-pressed="false">Prescriptions</button>
  </div>

  <section id="t-products">
    <div class="panel">
      <h1 id="pt">Add a product</h1>
      <form id="pf">
        <label>Name<input name="name" required maxlength="120"></label>
        <div class="three">
          <label>Category<select name="category"><option>Cosmetics</option><option>Supplements</option><option>Medical supplies</option></select></label>
          <label>Price (UGX)<input name="price" type="number" min="0" step="100" required></label>
          <label>Stock<input name="stock" type="number" min="0" value="10" required></label>
        </div>
        <div class="two">
          <label>Photo (optional)<input name="img" id="img" type="file" accept="image/*"></label>
          <label>Emoji if no photo<input name="emoji" value="🛍️" maxlength="4"></label>
        </div>
        <label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)"><input type="checkbox" name="active" checked style="width:auto"> Show in the shop</label>
        <div style="display:flex;gap:10px"><button class="btn" id="psave" type="submit">Save product</button><button class="btn g" id="pcancel" type="button" hidden>Cancel edit</button></div>
        <div class="msg" id="pm" role="status"></div>
      </form>
    </div>
    <div class="panel"><h1 style="font-size:22px">All products</h1><div id="plist"></div></div>
  </section>

  <section id="t-orders" hidden><div class="panel"><h1>Orders</h1><p class="note">Newest first. Change the status and the customer sees it on their account.</p><div id="olist"></div></div></section>
  <section id="t-rx" hidden><div class="panel"><h1>Prescriptions</h1><p class="note">Private files. Links open for 5 minutes.</p><div id="rlist"></div></div></section>
</main>

<script>
// ===== SETTINGS: same two values as in index.html =====
const SUPABASE_URL = "https://xlrwvbitiohlgsiizrrh.supabase.co";       // e.g. "https://abcdxyz.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhscnd2Yml0aW9obGdzaWl6cnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMzc1OTQsImV4cCI6MjExMDgxMzU5NH0.ouCWdL5qJ0YYvL3VWugscK-Ov1GxXiLn_uN7EC1Ds-w";  // the "anon public" key (never the service_role key)
// =======================================================
const $=s=>document.querySelector(s),fmt=n=>"UGX "+Number(n).toLocaleString("en-US");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS=["Received","Confirmed","Preparing","Ready or on the way","Completed"],RX=["received","verified","ready","rejected"];
const SB=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let me=null,editId=null,products=[];
const show=id=>{["login","app"].forEach(x=>$("#"+x).hidden=x!==id)};
async function boot(){
  if(!SB){show("login");$("#lm").textContent="Not connected yet. Add your Supabase URL and anon key at the top of this file.";return}
  const {data:{session}}=await SB.auth.getSession();
  if(!session){show("login");return}
  const {data:p}=await SB.from("profiles").select("name,is_admin").eq("id",session.user.id).maybeSingle();
  $("#out").hidden=false;$("#who").textContent=session.user.email;
  if(!p||!p.is_admin){show("login");$("#lm").textContent="This account is not an admin. Sign out and use an admin account.";return}
  me=session.user;show("app");loadProducts();
}
$("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$("#lm").textContent="";
  if(!SB){return}
  const {error}=await SB.auth.signInWithPassword({email:f.get("email").trim(),password:f.get("pw")});
  if(error){$("#lm").textContent="Email or password is incorrect.";return}
  e.target.reset();boot()};
$("#out").onclick=async()=>{await SB.auth.signOut();me=null;$("#out").hidden=true;$("#who").textContent="";show("login")};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  ["products","orders","rx"].forEach(t=>$("#t-"+t).hidden=t!==b.dataset.t);
  ({products:loadProducts,orders:loadOrders,rx:loadRx})[b.dataset.t]()};

// ---------- Products ----------
function shrink(file,max=900){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("x")),"image/jpeg",.82)};
  img.onerror=()=>rej(new Error("x"));img.src=u})}
async function loadProducts(){
  const {data,error}=await SB.from("products").select("*").order("category").order("name");
  if(error){$("#plist").innerHTML='<p class="msg e">Could not load products.</p>';return}
  products=data;
  $("#plist").innerHTML=data.length?data.map(p=>`<div class="row ${p.active?"":"off"}">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:`<div class="ph">${esc(p.emoji||"🛍️")}</div>`}
   <div><b>${esc(p.name)}</b><div class="note">${esc(p.category)} · ${fmt(p.price)} · stock ${p.stock}${p.active?"":" · hidden"}</div></div>
   <div class="acts"><button class="btn sm g" data-e="${p.id}">Edit</button><button class="btn sm g" data-v="${p.id}">${p.active?"Hide":"Show"}</button><button class="btn sm d" data-d="${p.id}">Delete</button></div></div>`).join(""):'<p class="note" style="margin-top:12px">No products yet. Add your first one above.</p>'}
$("#plist").onclick=async e=>{const t=e.target.dataset;
  if(t.e){const p=products.find(x=>x.id==t.e),f=$("#pf");editId=p.id;$("#pt").textContent="Edit product";
    f.name.value=p.name;f.category.value=p.category;f.price.value=p.price;f.stock.value=p.stock;f.emoji.value=p.emoji||"";f.active.checked=p.active;
    $("#pcancel").hidden=false;$("#pm").textContent="Choose a new photo only if you want to replace the current one.";scrollTo({top:0,behavior:"smooth"})}
  else if(t.v){const p=products.find(x=>x.id==t.v);await SB.from("products").update({active:!p.active}).eq("id",p.id);loadProducts()}
  else if(t.d){const p=products.find(x=>x.id==t.d);if(confirm(`Delete "${p.name}" permanently?`)){await SB.from("products").delete().eq("id",p.id);loadProducts()}}};
function resetForm(){editId=null;$("#pf").reset();$("#pt").textContent="Add a product";$("#pcancel").hidden=true;$("#pm").textContent=""}
$("#pcancel").onclick=resetForm;
$("#pf").onsubmit=async e=>{e.preventDefault();const f=e.target,m=$("#pm"),btn=$("#psave");m.className="msg";m.textContent="Saving…";btn.disabled=true;
  try{
    const row={name:f.name.value.trim(),category:f.category.value,price:parseInt(f.price.value,10)||0,stock:parseInt(f.stock.value,10)||0,emoji:f.emoji.value.trim()||"🛍️",active:f.active.checked};
    const file=$("#img").files[0];
    if(file){const blob=await shrink(file),path=`p-${Date.now()}.jpg`;
      const up=await SB.storage.from("product-images").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
      row.image_url=SB.storage.from("product-images").getPublicUrl(path).data.publicUrl}
    const r=editId?await SB.from("products").update(row).eq("id",editId):await SB.from("products").insert(row);
    if(r.error)throw r.error;
    resetForm();m.className="msg o";m.textContent="Saved. It is live in the shop.";loadProducts();
  }catch(err){m.className="msg e";m.textContent="Could not save. Check the details and try again."}
  btn.disabled=false};

// ---------- Orders ----------
const waNum=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="256"+d.slice(1);return d};
async function loadOrders(){
  const {data,error}=await SB.from("orders").select("*").order("created_at",{ascending:false}).limit(100);
  if(error){$("#olist").innerHTML='<p class="msg e">Could not load orders.</p>';return}
  const ids=[...new Set(data.map(o=>o.user_id))],pr={};
  if(ids.length){const {data:ps}=await SB.from("profiles").select("id,name,phone").in("id",ids);(ps||[]).forEach(p=>pr[p.id]=p)}
  $("#olist").innerHTML=data.length?data.map(o=>{const c=pr[o.user_id]||{};return `<div class="ord"><div class="h"><b>${esc(o.code)} · ${fmt(o.total)}</b><span class="note">${new Date(o.created_at).toLocaleString("en-GB")}</span></div>
   <div>${esc(c.name||"Customer")} · <a href="https://wa.me/${waNum(c.phone)}" target="_blank" rel="noopener">${esc(c.phone||"")}</a></div>
   <div class="note">${(o.items||[]).map(x=>x.q+" × "+esc(x.n)).join(", ")}</div>
   <div class="note">${esc(o.delivery||"")}${o.address?" · "+esc(o.address):""} · ${esc(o.payment||"")}</div>
   <label>Status<select data-o="${o.id}">${STEPS.map((s,i)=>`<option value="${i}" ${i===o.status?"selected":""}>${s}</option>`).join("")}</select></label></div>`}).join(""):'<p class="note" style="margin-top:12px">No orders yet.</p>'}
$("#olist").onchange=async e=>{const id=e.target.dataset.o;if(!id)return;const {error}=await SB.from("orders").update({status:parseInt(e.target.value,10)}).eq("id",id);if(error)alert("Could not update the status.")};

// ---------- Prescriptions ----------
async function loadRx(){
  const {data,error}=await SB.from("prescriptions").select("*").order("created_at",{ascending:false}).limit(100);
  if(error){$("#rlist").innerHTML='<p class="msg e">Could not load prescriptions.</p>';return}
  $("#rlist").innerHTML=data.length?data.map(r=>`<div class="ord"><div class="h"><b>RX-${r.id} · ${esc(r.name||"")}</b><span class="note">${new Date(r.created_at).toLocaleString("en-GB")}</span></div>
   <div><a href="https://wa.me/${waNum(r.phone)}" target="_blank" rel="noopener">${esc(r.phone||"")}</a> · ${esc(r.delivery||"")}</div>
   ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}
   <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap"><button class="btn sm" data-f="${esc(r.file_path)}">View prescription</button>
   <label>Status<select data-r="${r.id}">${RX.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></label></div></div>`).join(""):'<p class="note" style="margin-top:12px">No prescriptions yet.</p>'}
$("#rlist").onclick=async e=>{const f=e.target.dataset.f;if(!f)return;const {data,error}=await SB.storage.from("prescriptions").createSignedUrl(f,300);if(error)alert("Could not open the file.");else window.open(data.signedUrl,"_blank","noopener")};
$("#rlist").onchange=async e=>{const id=e.target.dataset.r;if(!id)return;const {error}=await SB.from("prescriptions").update({status:e.target.value}).eq("id",id);if(error)alert("Could not update the status.")};
boot();
</script>
</body>
</html>
